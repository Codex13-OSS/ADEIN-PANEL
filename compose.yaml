services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-adein_crm_dev}
      MYSQL_USER: ${DB_USER:-adein}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - adein_mariadb_data:/var/lib/mysql
      # Cold start SOLO con volumen vacío: docker-entrypoint-initdb.d no se
      # re-ejecuta si ya existen datos (persistencia garantizada).
      - ./docs/db/004_adein_local_lead_agent_schema.sql:/docker-entrypoint-initdb.d/10-adein-lead-agent-schema.sql:ro
      - ./docs/db/005_commercial_intelligence_v1.sql:/docker-entrypoint-initdb.d/20-commercial-intelligence.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    expose:
      - "3306"
    restart: unless-stopped

  lead-agent:
    build:
      context: .
      dockerfile: Dockerfile.lead-agent
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-adein_crm_dev}
      DB_USER: ${DB_USER:-adein}
      DB_PASSWORD: ${DB_PASSWORD}
      LEAD_AGENT_LISTEN: "0.0.0.0"
      ADEIN_LIA_BASE_URL: ${ADEIN_LIA_BASE_URL:-/lia}
      ADEIN_LIA_HANDOFF_SECRET_FILE: /run/secrets/adein-lia-handoff-secret
    volumes:
      - ${ADEIN_LIA_HANDOFF_SECRET_HOST_PATH:-/dev/null}:/run/secrets/adein-lia-handoff-secret:ro
    expose:
      - "3192"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADEIN_LIA_URL: ${ADEIN_LIA_URL:-/lia}
    ports:
      - "${ADEIN_HTTP_PORT:-8080}:80"
    volumes:
      # BETA PRIVADA: htpasswd externo read-only. Fallo cerrado si falta
      # (nginx no arranca sin el archivo). NUNCA dentro de la imagen.
      - ${ADEIN_HTPASSWD_HOST_PATH:-/dev/null}:/etc/nginx/htpasswd:ro
    depends_on:
      lead-agent:
        condition: service_started
    restart: unless-stopped

volumes:
  adein_mariadb_data:
