server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects relativos: preserva el puerto real del Host (p.ej. :18080)
    # y no fuerza http://host/path sin puerto cuando ADEIN vive en un puerto no estándar.
    absolute_redirect off;

    # ---------------------------------------------------------
    # BETA PRIVADA: barrera Basic Auth delante de TODO el sitio.
    # El archivo htpasswd se monta desde el host (read-only).
    # NUNCA está en la imagen ni en Git.
    # Fallo cerrado: si el archivo no existe, nginx no arranca.
    # ---------------------------------------------------------
    auth_basic "ADEIN Private Beta";
    auth_basic_user_file /etc/nginx/htpasswd;

    # ---------------------------------------------------------
    # LIA-PAGARE bajo el mismo origen de ADEIN.
    # El proceso LIA permanece independiente en :3103 (host).
    # El navegador nunca necesita conocer ni acceder a :3103.
    # ---------------------------------------------------------

    # /lia (sin slash) -> /lia/ preservando query string y puerto.
    location = /lia {
        return 308 /lia/$is_args$args;
    }

    # Contener el login de LIA bajo /lia/:
    # logout() y requireAuth() de LIA redirigen a "/login.html" (root-absolute).
    # Se reescribe en el borde para que el iframe nunca escape al SPA de ADEIN.
    location = /login.html {
        return 308 /lia/login.html;
    }

    # El handoff root-absolute NO es un flujo autorizado.
    # El único handoff permitido es /lia/api/auth/handoff (embedded, con sub_filter).
    location = /api/auth/handoff {
        return 404;
    }

    # Única excepción de la barrera beta: /api/auth/verify valida el Bearer de LIA
    # (LIA responde 401 sin token válido; no expone datos). Necesario porque
    # LIA envía Authorization: Bearer explícito, que la Basic Auth de nginx
    # no puede satisfacer. El resto de la API de LIA sigue tras la barrera.
    location = /api/auth/verify {
        auth_basic off;
        proxy_pass http://host.docker.internal:3103/api/auth/verify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        error_page 502 503 504 =503 /lia-unavailable.html;
    }

    # Handoff embedded:
    # LIA estable devuelve window.location.replace("/?embedded=1").
    # Se adapta únicamente en el borde para permanecer bajo /lia/.
    location = /lia/api/auth/handoff {
        proxy_pass http://host.docker.internal:3103/api/auth/handoff;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lia;
        proxy_set_header Accept-Encoding "";

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        sub_filter_once on;
        sub_filter '"/?embedded=1"' '"/lia/?embedded=1"';

        error_page 502 503 504 =503 /lia-unavailable.html;
    }

    # UI / assets / resto de endpoints solicitados con prefijo /lia/.
    # El slash final en proxy_pass elimina /lia/ antes de llegar a LIA.
    location /lia/ {
        proxy_pass http://host.docker.internal:3103/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lia;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        error_page 502 503 504 =503 /lia-unavailable.html;
    }

    # ---------------------------------------------------------
    # Compatibilidad para el componente LIA estable.
    #
    # LIA usa actualmente rutas API root-absolute.
    # No modificamos LIA; sólo sus endpoints conocidos se enrutan
    # al proceso paralelo. /api/local/* sigue perteneciendo a ADEIN.
    # ---------------------------------------------------------
    location ~ ^/api/(auth/|capturas$|generar$|descargar(?:/|$)|print/) {
        proxy_pass http://host.docker.internal:3103;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        error_page 502 503 504 =503 /lia-unavailable.html;
    }

    # Lead Agent API de ADEIN — debe conservar prioridad conceptual.
    location /api/local/ {
        proxy_pass http://lead-agent:3192/api/local/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA ADEIN
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'OK';
    }
}
